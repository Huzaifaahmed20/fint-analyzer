<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spend Tracker</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Spend Tracker</h1>
    <div class="month-picker">
      <label for="month">Month</label>
      <input type="month" id="month" />
    </div>
  </header>

  <main>
    <section class="card" id="import-card">
      <h2>Import CSV</h2>
      <form id="import-form">
        <input type="file" id="csv-file" accept=".csv,text/csv" required />
        <button type="submit">Import</button>
      </form>
      <p id="import-status" class="muted"></p>
    </section>

    <section class="card" id="total-card">
      <h2>Total Spend</h2>
      <p class="big-number" id="total-spend">AED 0.00</p>
    </section>

    <section class="card" id="trend-card">
      <h2>6-Month Trend</h2>
      <div class="trend-chart" id="trend-chart"></div>
    </section>

    <section class="card" id="category-card">
      <h2>Category Breakdown</h2>
      <div id="category-breakdown"></div>
    </section>

    <section class="card" id="budgets-card">
      <h2>Budgets</h2>
      <table id="budgets-table">
        <thead>
          <tr><th>Category</th><th>Monthly Limit (AED)</th><th></th></tr>
        </thead>
        <tbody id="budgets-body"></tbody>
      </table>
    </section>

    <section class="card" id="transactions-card">
      <h2>Transactions</h2>
      <div class="filters">
        <input type="search" id="search" placeholder="Search description..." />
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
      </div>
      <table id="transactions-table">
        <thead>
          <tr><th>Date</th><th>Description</th><th>Category</th><th class="amount-col">Amount (AED)</th></tr>
        </thead>
        <tbody id="transactions-body"></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
